name: Apply worker

on:
  schedule:
    # Runs inside the ingest window (even hours :10-:50) so the Neon compute is already awake.
    - cron: "20,50 */2 * * *"
  workflow_dispatch:

concurrency:
  group: applykar-worker
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: khajamujahid/applykar
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.65.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Apply queued jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          APPLYKAR_URL: https://applykar-khajamujahids-projects.vercel.app
          ALLOWED_EMAILS: khajamujahiddin@gmail.com
          APPLY_SUBMIT: "1"
          APPLY_CONCURRENCY: "2"
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set. Add the Neon pooled URL as an Actions secret named DATABASE_URL."
            exit 1
          fi
          pnpm apply:worker -- --once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apply-proofs
          path: data/proofs
          if-no-files-found: ignore
          retention-days: 7
